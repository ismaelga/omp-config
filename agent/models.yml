# Override-only block: ollama-cloud and openai-codex are built-in providers
# (authenticated from a stored /login credential; env fallback for the former is
# OLLAMA_CLOUD_API_KEY -- OLLAMA_API_KEY belongs to the local ollama engine).
# Do not redeclare baseUrl/api/models here -- that replaces curated catalog
# metadata (context windows, output caps, thinking levels) with hand-written
# guesses.
#
# Purpose of this file: correct catalog metadata the bundled rows get wrong.
# Two entries remain: one astra context window and one ollama-cloud output cap.
#
# Removed 2026-09-11: the luna and terra price corrections this file was
# originally created for. The bundled catalog now carries $0.20/$1.20 and
# $2.00/$12.00 itself -- verified by diffing `omp models --json` with this file
# moved aside -- so both overrides restated a value nobody disputed. An override
# that agrees with its catalog is indistinguishable from one that is wrong, and
# it hides the moment the catalog changes underneath it. Re-check by the same
# method before adding a price back.
#
# What used to be here, and why it is gone: every model carried a
# `contextPromotionTarget` so a context overflow switched model instead of
# compacting. Context promotion is now disabled outright
# (`contextPromotion.enabled: false` in config.yml), so the targets were dead
# config. Overflow falls back to compaction, which is the documented and
# evaluated path; model-switching-on-overflow had no published evaluation
# behind it. Do not reintroduce a `contextPromotionTarget` here without
# re-enabling the feature in config.yml first -- on its own it does nothing.
#
# Also removed in the same pass, and worth not repeating: minimax-m3 and
# deepseek-v4-pro each carried a target to deepseek-v4-flash under a stale
# "524K -> 1M" comment. Verified against vendor sources on 2026-08-12, M3 is
# in fact 1M (a higher long-context billing tier starts above 512K, which is
# probably where 524K came from), so both were 1M -> 1M no-ops.
providers:
  ollama-cloud:
    modelOverrides:
      # Discovery landed this row on 2026-09-11 (the day after DeepSeek shipped
      # V4.1-Flash) with maxTokens 8192, which is a guess: every sibling DeepSeek
      # row on this provider carries 65536 -- isOllamaCloudOutputCapped pins
      # DeepSeek V4 Pro/Flash to min(contextWindow, OLLAMA_CLOUD_MAX_OUTPUT_TOKENS)
      # -- and the vendor advertises 384K. Measured on the wire the same day:
      # "count 1 to 4000, one per line" returned all 4000 lines, eval_count 11469,
      # done_reason "stop", so the route serves well past 8192. 65536 matches the
      # provider's own ceiling rather than the vendor's larger number, which is the
      # value omp would have assigned had the id been recognised.
      # Cloud rows also set omitMaxOutputTokens, so this skews budgeting rather than
      # truncating the wire -- which is exactly why a wrong cap survives unnoticed.
      # This matters here because the model is verbose: at the pinned :low tier
      # bakeoff answers ran 9.2-22.4K output tokens, and 61.1K at :high
      # (2026-09-14, three problems x 3 samples).
      # Re-verified 2026-09-14 on omp 18.1.21 and still load-bearing. Discovery
      # is not cached -- models.db is 0 bytes, models.dev carries no ollama
      # provider at all, and the bundled ollama-cloud KDL rows hold thinking
      # policy but no limits -- so the pre-override number can only be read by
      # running discovery without this file. A throwaway profile does that:
      #   omp --profile <fresh> models ollama-cloud --json
      # Today it still returns maxTokens 8192 for this id against 65536 for
      # every sibling (v4-flash, v4-pro, v3.2), contextWindow 1048576. The cap
      # function has not learned the id in three days. It matters more now than
      # when it was written: `task` runs here, and an 8192 budget sits under
      # the tier's own measured floor.
      deepseek-v4.1-flash:
        maxTokens: 65536
  openai-codex:
    modelOverrides:
      # gpt-6-astra: catalog pins contextWindow 272000, so omp compacts at a
      # third of what the plan actually allows. 272000 is the backend's
      # DEFAULT, not its ceiling -- ~/.codex/models_cache.json (codex 0.153.4,
      # fetched 2026-09-09) declares gpt-6-astra as
      # context_window 272000 / max_context_window 872000, same shape as
      # gpt-5.6-sol/terra/luna (which the catalog already carries at 1000000,
      # i.e. ABOVE this ceiling -- left alone, but they are the inconsistency
      # that makes astra look wrong rather than conservative).
      # 872000 is the plan-side ceiling and is the largest value that means
      # anything: codex clamps a user override to it (models-manager/src/
      # model_info.rs, `context_window.min(max_context_window)`) -- read from
      # codex sources when this was written, not re-checked since, so treat the
      # clamp as plausible rather than proven.
      # The 1,050,000 figure models.dev/openrouter carry is the API tier
      # reached through an OPENAI_API_KEY, NOT through chatgpt.com/backend-api.
      # Unverified on the wire: nothing here proves the backend SERVES 872k on
      # this plan. If it refuses, the turn fails `context_window_exceeded` and,
      # with contextPromotion disabled, falls back to compaction -- one wasted
      # request per overflow, recoverable. Revert to 272000 if that shows up.
      # Re-verified 2026-09-14 on omp 18.1.21: the bundled catalog still pins
      # 272000 and the string 872000 does not occur anywhere in the binary, so
      # the 872000 that `omp models --json` reports can only be this override.
      # Same recheck method as the row above -- discovery in a fresh profile.
      gpt-6-astra:
        contextWindow: 872000
