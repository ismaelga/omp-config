task:
  disabledAgents:
    - sonic
    - momus
    - cavecrew-benchwright
    - cavecrew-builder
    - cavecrew-challenger
    - cavecrew-debugger
    - cavecrew-fixscout
    - cavecrew-githistorian
    - cavecrew-investigator
    - cavecrew-plancritic
    - cavecrew-refactorer
    - cavecrew-reviewer
    - cavecrew-sentinel
    - cavecrew-simplifier
    - cavecrew-testrunner
    - cavecrew-testwright
  eager: preferred
  showResolvedModelBadge: true
  enableLsp: true
  isolation:
    mode: none
modelRoles:
  plan: anthropic/claude-fable-5:high
  slow: anthropic/claude-fable-5:high
  task: ollama-cloud/deepseek-v4-flash:high
  smol: ollama-cloud/minimax-m3
  tiny: ollama-cloud/gpt-oss:20b
  designer: ollama-cloud/minimax-m3:high
  vision: ollama-cloud/minimax-m3
  commit: ollama-cloud/gpt-oss:120b
  advisor: openrouter/z-ai/glm-5.3:max
  default: anthropic/claude-opus-5:max
modelProviderOrder:
  - anthropic
  - openai-codex
  - ollama-cloud
  - opencode-go
  - google-antigravity
contextPromotion:
  enabled: false
theme:
  dark: dark-catppuccin
symbolPreset: nerd
statusLine:
  preset: compact
  separator: powerline-thin
  showHookStatus: true
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
display:
  showTokenUsage: true
  shimmer: kitt
  cacheMissMarker: true
doubleEscapeAction: tree
renderMermaid:
  enabled: true
github:
  enabled: true
memory:
  backend: mnemopi
setupVersion: 2
terminal:
  showProgress: false
tui:
  textSizing: false
advisor:
  enabled: false
  syncBacklog: 3
steeringMode: one-at-a-time
interruptMode: immediate
stt:
  modelName: parakeet
  submitTrigger: never
  enabled: false
share:
  store: blob
magicKeywords:
  enabled: true
providers:
  memoryModel: online
  fireworksTier: standard
  tinyModel: online
  kimiApiFormat: auto
  autoThinkingMaxEffort: max
  ollama-cloud:
    maxConcurrency: 8
  webSearchOrder: []
retry:
  fallbackChains:
    ollama-cloud/*:
      - opencode-go/*
      - openai-codex/gpt-5.6-luna:high
      - openrouter/deepseek/deepseek-v4-flash:high
    ollama-cloud/gpt-oss:20b:
      - ollama-cloud/minimax-m3
      - openrouter/minimax/minimax-m3:high
    ollama-cloud/gpt-oss:120b:
      - ollama-cloud/glm-5.2
      - openrouter/z-ai/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
      - openrouter/z-ai/glm-5.2:high
    ollama-cloud/glm-5.2:
      - openrouter/z-ai/glm-5.3:high
      - opencode-go/deepseek-v4-pro
      - openai-codex/gpt-5.6-luna:high
      - openrouter/z-ai/glm-5.2:high
    ollama-cloud/kimi-k3:
      - openrouter/moonshotai/kimi-k3:high
      - opencode-go/kimi-k3:high
    openrouter/z-ai/glm-5.3:
      - opencode-go/glm-5.3:high
      - ollama-cloud/glm-5.2:high
    openrouter/moonshotai/kimi-k3:
      - opencode-go/kimi-k3:high
      - openrouter/z-ai/glm-5.3:high
    openrouter/*:
      - openrouter/z-ai/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
    openai-codex/gpt-5.6-luna:
      - openrouter/z-ai/glm-5.3:high
      - ollama-cloud/glm-5.2:high
      - opencode-go/glm-5.3:high
    openai-codex/gpt-5.6-sol:
      - openai-codex/gpt-5.6-terra
      - anthropic/claude-opus-5:high
      - openrouter/deepseek/deepseek-v4-pro-0813:high
    anthropic/claude-fable-5:
      - openai-codex/gpt-5.6-sol:high
      - openai-codex/gpt-5.6-terra:high
      - openrouter/deepseek/deepseek-v4-pro-0813:high
    anthropic/*:
      - anthropic/claude-sonnet-5
      - openai-codex/gpt-5.6-terra:high
      - openrouter/z-ai/glm-5.3:high
    default:
      - openai-codex/gpt-5.6-sol:high
      - openrouter/z-ai/glm-5.3:high
mnemopi:
  dbPath: ""
  scoping: per-project
  proactiveLinking: true
  autoRetain: false
  injectionTokenLimit: 1500
  recallLimit: 3
  embeddingModel: ""
edit:
  mode: hashline
python:
  kernelMode: session
ruby:
  interpreter: ""
astGrep:
  enabled: true
checkpoint:
  enabled: true
commands:
  enableClaudeUser: true
defaultThinkingLevel: auto
hideThinkingBlock: true
dev:
  autoqaConsent: granted
bash:
  autoBackground:
    enabled: true
features:
  unexpectedStopDetection: true
compaction:
  idleEnabled: true
lsp:
  formatOnWrite: true
thinkingBudgets:
  max: 65536
tier:
  subagent: inherit
skills:
  enabled: true
  enableSkillCommands: true
composer:
  shape: pi
