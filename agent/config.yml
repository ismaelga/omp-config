task:
  disabledAgents:
    - sonic
    - reviewer
    - security-reviewer
  eager: preferred
  showResolvedModelBadge: true
  enableLsp: true
  isolation:
    mode: none
modelRoles:
  plan: anthropic/claude-fable-5:high
  slow: anthropic/claude-fable-5:high
  task: ollama-cloud/glm-5.2:high
  smol: ollama-cloud/minimax-m3
  tiny: ollama-cloud/gpt-oss:20b
  designer: ollama-cloud/minimax-m3:high
  vision: ollama-cloud/minimax-m3
  commit: ollama-cloud/gpt-oss:120b
  advisor: ollama-cloud/glm-5.2:high
  default: anthropic/claude-opus-5:high
modelProviderOrder:
  - anthropic
  - openai-codex
  - ollama-cloud
  - opencode-go
  - cursor
  - google-antigravity
contextPromotion:
  enabled: true
theme:
  dark: dark-catppuccin
symbolPreset: nerd
statusLine:
  preset: compact
  separator: powerline-thin
  showHookStatus: true
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
display:
  showTokenUsage: true
  shimmer: kitt
  cacheMissMarker: true
doubleEscapeAction: tree
renderMermaid:
  enabled: true
github:
  enabled: true
memory:
  backend: mnemopi
setupVersion: 1
terminal:
  showProgress: false
tui:
  textSizing: false
advisor:
  enabled: true
  syncBacklog: 3
steeringMode: one-at-a-time
interruptMode: immediate
stt:
  modelName: parakeet
  submitTrigger: never
  enabled: false
share:
  store: blob
magicKeywords:
  enabled: true
providers:
  memoryModel: online
  fireworksTier: standard
  tinyModel: online
  kimiApiFormat: auto
  autoThinkingMaxEffort: max
  ollama-cloud:
    maxConcurrency: 8
  webSearchOrder: []
retry:
  fallbackChains:
    ollama-cloud/*:
      - opencode-go/*
      - openai-codex/gpt-5.6-luna:high
    ollama-cloud/gpt-oss:20b:
      - ollama-cloud/minimax-m3
    ollama-cloud/gpt-oss:120b:
      - ollama-cloud/glm-5.2
      - opencode-go/glm-5.2
      - openai-codex/gpt-5.6-luna:high
    ollama-cloud/glm-5.2:
      - opencode-go/deepseek-v4-pro
      - opencode-go/glm-5.2
    openai-codex/gpt-5.6-luna:
      - ollama-cloud/glm-5.2:high
      - opencode-go/glm-5.2
    openai-codex/gpt-5.6-sol:
      - openai-codex/gpt-5.6-terra
      - anthropic/claude-opus-5:high
    anthropic/claude-fable-5:
      - openai-codex/gpt-5.6-sol:high
      - openai-codex/gpt-5.6-terra:high
    anthropic/*:
      - anthropic/claude-sonnet-5
      - openai-codex/gpt-5.6-terra:high
    default:
      - openai-codex/gpt-5.6-sol:high
mnemopi:
  dbPath: ""
  scoping: per-project
  proactiveLinking: true
  autoRetain: false
  injectionTokenLimit: 1500
  recallLimit: 3
  embeddingModel: ""
edit:
  mode: hashline
python:
  kernelMode: session
ruby:
  interpreter: ""
astGrep:
  enabled: true
checkpoint:
  enabled: true
commands:
  enableClaudeUser: true
defaultThinkingLevel: auto
hideThinkingBlock: true
dev:
  autoqaConsent: granted
bash:
  autoBackground:
    enabled: true
features:
  unexpectedStopDetection: true
compaction:
  idleEnabled: true
lsp:
  formatOnWrite: true
thinkingBudgets:
  max: 65536
tier:
  subagent: inherit
skills:
  ignoredSkills:
    - executing-plans
    - caveman-help
    - caveman-stats
