task:
  disabledAgents:
    - sonic
    - momus
    - cavecrew-benchwright
    - cavecrew-builder
    - cavecrew-challenger
    - cavecrew-debugger
    - cavecrew-fixscout
    - cavecrew-githistorian
    - cavecrew-investigator
    - cavecrew-plancritic
    - cavecrew-refactorer
    - cavecrew-reviewer
    - cavecrew-sentinel
    - cavecrew-simplifier
    - cavecrew-testrunner
    - cavecrew-testwright
  eager: preferred
  showResolvedModelBadge: true
  enableLsp: true
  isolation:
    mode: none
  agentModelOverrides:
    scout: "@scout"
    librarian: "@librarian"
    reviewer: "@critic"
    security-reviewer: "@sentinel"
modelRoles:
  plan: anthropic/claude-fable-5:high
  slow: anthropic/claude-fable-5:high
  # Coding, not speed, decides this role -- `task` writes the code it is given.
  # Picked by a measured bakeoff (2026-09-01), not by index alone. Two problems
  # shaped like this harness's own code -- a unified-diff generator and a glob
  # matcher -- scored by EXECUTING the output against hidden validators (diff was
  # checked by applying it back and requiring exact reconstruction, correct hunk
  # arithmetic, context bounds, and minimality against difflib):
  #   glm-5.3 think=high              2/2 pass   75 s / 218 s    $0
  #   gemini-3.7-flash high           3/4 pass   10.2 s flat     $0.04-0.11 per solve
  #   deepseek-v4-flash               0/4 pass
  # This inverts the AA Coding Index order (gemini 76.1 #7 > glm-5.3 74.8 #9 >
  # deepseek 69.1 #23) at the top, but corroborates the ~7-point deepseek gap hard.
  # glm-5.3 wins on being the only model to solve both, at zero marginal cost; it
  # pays in wall clock. gemini is the swap if latency per solve ever outranks
  # dollars -- but its 10 s is a FIXED transport floor (effort=low with 0 reasoning
  # tokens still takes 10.0 s over OpenRouter), so it taxes every small agent turn,
  # and agent loops are mostly small turns. A direct Google endpoint might not carry
  # that floor; untested.
  # WARNING, measured here: deepseek-v4-flash in REASONING mode spirals on hard
  # prompts -- three attempts hit the 65536-token ceiling at 250 s+ and returned no
  # code at all. With think=False it is fast (12.4 s) and merely wrong. See `scout`
  # and `librarian` below, which both sit on that model.
  task: ollama-cloud/glm-5.3:high
  # minimax-m3 evicted from smol/librarian/designer 2026-08-28: slowest model
  # measured on this machine (25.4 tok/s, 5569 ms TTFT, agent.db model_perf) and
  # last of 30 on llm-stats coding (34.4, FrontierCode 14.7). Nothing it held
  # needed a weak slow model.
  smol: ollama-cloud/glm-5.3-flash
  # gpt-oss:120b is FASTER than the 20b here -- 258.2 tok/s / 706 ms TTFT vs
  # 77.7 / 1308 ms. Both $0 on the flat plan, so the bigger one is free speed.
  tiny: ollama-cloud/gpt-oss:120b
  # Native multimodal (z.ai: first native multimodal in the GLM-5 series) and
  # vendor-documented screenshot -> UI coding; 2.1x the incumbent's throughput.
  designer: zai/glm-5.3-flash
  # Spending the OpenRouter discount here and nowhere else. Gemini 3.7 Flash is
  # $0.375/$1.875 against Google's own $0.75/$3.75 list -- 50% off, and below the
  # 3.6/3.5 generations it replaces. `vision` is the one role where that price is
  # irrelevant (a few images per session) and the capability gap is real: this is
  # the only candidate taking text+image+video+file+audio, where glm-5.3-flash is
  # image-only. Gemini also leads MMMU-Pro and ScreenSpot-Pro (UI grounding, which
  # is what a coding agent actually looks at); glm wins CharXiv-R 0.894 vs 0.887,
  # a chart-reasoning edge that does not outweigh the modality gap.
  # Revert to zai/glm-5.3-flash when the discount ends -- it is the fallback below.
  vision: openrouter/google/gemini-3.7-flash
  commit: ollama-cloud/gpt-oss:120b
  # Tripwire, not reviewer. Advisor cost is uncached INPUT (p1 bench: 4.32M in vs
  # 18k out, cacheRead=0), so input price and prefill decide this, not reasoning
  # rank. glm-5.3-flash has the lowest TTFT measured here (1279 ms) and sits on
  # the flat plan. Its verbosity penalty is irrelevant when output is 0.4% of spend.
  advisor: zai/glm-5.3-flash
  # :xhigh, not :max. Artificial Analysis measures both at intelligence 63, but
  # max costs 42.91 s TTFT / 51.94 s total against xhigh's 20.04 s / 29.37 s.
  # The top tier buys latency, not correctness. Budget follows the pin:
  # thinkingBudgets.xhigh defaults to 32768 vs the 65536 set for max below.
  # `ultrathink` still reaches max on demand, so the ceiling is not lost.
  default: anthropic/claude-opus-5:xhigh
  scout: ollama-cloud/deepseek-v4-flash:high
  # 1M ctx, BrowseComp 85.9%, and 7x the throughput of the minimax-m3 it replaces.
  librarian: ollama-cloud/deepseek-v4-flash
  # Pinned :high deliberately. Unpinned, `auto` can reach `max`, where Artificial
  # Analysis measures TTFT 141.99 s against 2.84 s at :high -- same model, same
  # review quality, 50x the wait.
  critic: openai-codex/gpt-5.6-terra:high
  sentinel: zai/glm-5.3:high
modelProviderOrder:
  - anthropic
  - zai
  - ollama-cloud
  - openrouter
  - opencode-go
  # google-antigravity removed 2026-08-28: credential is deleted
  # (auth_credentials.disabled_cause = "deleted by user"), so it never resolves.
contextPromotion:
  enabled: false
theme:
  dark: dark-catppuccin
symbolPreset: nerd
statusLine:
  preset: compact
  separator: powerline-thin
  showHookStatus: true
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
display:
  showTokenUsage: true
  shimmer: kitt
  cacheMissMarker: true
doubleEscapeAction: tree
renderMermaid:
  enabled: true
github:
  enabled: true
memory:
  backend: mnemopi
setupVersion: 2
terminal:
  showProgress: false
tui:
  textSizing: false
advisor:
  # Re-enabled 2026-08-28. The 2026-08-13 A/B did not condemn this -- `spawns=0`
  # counts task-tool calls, and the advisor is not a spawn. All seven heavy runs
  # kept __advisor.watchdog.jsonl, and the notes were real: t2 caught lots.pop()
  # needing to be lots.shift(), t4 caught two dangling refs that would have thrown,
  # p1 caught saleCostUsd used where applySale was required. It never changed a
  # score because minimal already scored 1.00 everywhere the advisor spoke -- you
  # cannot measure a safety net on tasks nobody falls off.
  #
  # The volume complaint in WATCHDOG.md (584 notes / 19 sessions, ~31 interruptions,
  # measured 2026-08-12) predates the file written to fix it. The bench one day
  # later shows 0-8 notes per task. That fix held; re-enable on top of it.
  enabled: true
  # off, not 1. syncBacklog blocks the PRIMARY up to 30s whenever the advisor is
  # N deltas behind -- the likely bulk of heavy's 527s vs minimal's 270s on p1.
  # A tripwire may arrive late; a `blocker` still triggers a turn once it catches
  # up (advisor-watchdog.md). This buys the safety net at zero primary tax.
  syncBacklog: "off"
steeringMode: one-at-a-time
interruptMode: immediate
stt:
  modelName: parakeet
  submitTrigger: never
  enabled: false
share:
  store: blob
magicKeywords:
  enabled: true
providers:
  memoryModel: online
  fireworksTier: standard
  tinyModel: online
  kimiApiFormat: auto
  autoThinkingMaxEffort: max
  ollama-cloud:
    maxConcurrency: 8
  webSearchOrder: []
retry:
  fallbackChains:
    # Provider order: opencode-go outranks openrouter wherever both carry the same
    # weights -- openrouter is the metered path, opencode-go is not.
    # Every link must keep image input, or a retry silently blinds the vision role.
    openrouter/google/gemini-3.7-flash:
      - zai/glm-5.3-flash
      - ollama-cloud/gemini-3-flash-preview
      - anthropic/claude-opus-5:high
    ollama-cloud/deepseek-v4-flash:
      - opencode-go/deepseek-v4-flash:high
      - openrouter/deepseek/deepseek-v4-flash:high
      - ollama-cloud/glm-5.3-flash:high
      - openai-codex/gpt-5.6-luna:high
    ollama-cloud/*:
      - openai-codex/gpt-5.6-luna:high
      - opencode-go/*
      - openrouter/deepseek/deepseek-v4-flash:high
    ollama-cloud/gpt-oss:20b:
      - ollama-cloud/minimax-m3
      - openrouter/minimax/minimax-m3:high
    ollama-cloud/gpt-oss:120b:
      - ollama-cloud/glm-5.3
      - zai/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
    ollama-cloud/glm-5.2:
      - ollama-cloud/glm-5.3
      - zai/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
      - opencode-go/deepseek-v4-pro
    # ollama-cloud gained glm-5.3 + glm-5.3-flash 2026-08-30 (verified against
    # /api/tags). The flat-plan GLM link below is now the real 5.3; glm-5.2 stood
    # in for it only because 5.3 was absent from that catalog.
    # Tail is terra, not luna, since `task` moved here 2026-09-01. The first two
    # links are the same 74.8-index weights from other providers; the last resort
    # must not silently downgrade the role that overflowed into it. AA Coding
    # Index: terra 76.7 #4 against luna 71.4 #18. Terra is already the `critic`
    # pin and measures 38.3 tok/s / 1734 ms here over 229 samples.
    ollama-cloud/glm-5.3:
      - zai/glm-5.3:high
      - opencode-go/glm-5.3:high
      - openai-codex/gpt-5.6-terra:high
    ollama-cloud/glm-5.3-flash:
      - zai/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
      - ollama-cloud/glm-5.3:high
    ollama-cloud/kimi-k3:
      - opencode-go/kimi-k3:high
      - openrouter/moonshotai/kimi-k3:high
    openai-codex/gpt-5.6-terra:
      - openai-codex/gpt-5.6-luna:high
      - ollama-cloud/minimax-m3:high
      - zai/glm-5.3:high
    openrouter/z-ai/glm-5.3:
      - zai/glm-5.3:high
      - openai-codex/gpt-5.6-terra:high
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
    openrouter/z-ai/glm-5.3-flash:
      - zai/glm-5.3-flash
      - ollama-cloud/glm-5.3-flash
      - opencode-go/glm-5.3-flash:high
      - openai-codex/gpt-5.6-luna:high
    zai/glm-5.3-flash:
      - ollama-cloud/glm-5.3-flash:high
      - opencode-go/glm-5.3-flash:high
      - openrouter/z-ai/glm-5.3-flash
      - openai-codex/gpt-5.6-luna:high
    zai/glm-5.3:
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
      - openrouter/z-ai/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
    zai/*:
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
      - openrouter/z-ai/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
    openrouter/moonshotai/kimi-k3:
      - zai/glm-5.3:high
      - opencode-go/kimi-k3:high
    openrouter/*:
      - zai/glm-5.3:high
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
    openai-codex/gpt-5.6-luna:
      - zai/glm-5.3:high
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
    openai-codex/gpt-5.6-sol:
      - openai-codex/gpt-5.6-terra
      - anthropic/claude-opus-5:high
      - openrouter/deepseek/deepseek-v4-pro-0813:high
    anthropic/claude-fable-5:
      - openai-codex/gpt-5.6-sol:high
      - openai-codex/gpt-5.6-terra:high
      - openrouter/deepseek/deepseek-v4-pro-0813:high
    anthropic/*:
      - openai-codex/gpt-5.6-sol:high
      - zai/glm-5.3:high
      - openai-codex/gpt-5.6-terra:high
      - ollama-cloud/glm-5.3:high
      - openrouter/deepseek/deepseek-v4-pro-0813:high
    default:
      - openai-codex/gpt-5.6-sol:high
      - zai/glm-5.3:high
