task:
  disabledAgents:
    # Minimal-guidance profile (adopted 2026-08-14, see bench/README.md).
    # Vanilla reviewer/security-reviewer re-enabled: minimal means fewer
    # instructions, not fewer tools. Agent definitions stay on disk, inert.
    - sonic
    - momus
    - cavecrew-benchwright
    - cavecrew-builder
    - cavecrew-challenger
    - cavecrew-debugger
    - cavecrew-fixscout
    - cavecrew-githistorian
    - cavecrew-investigator
    - cavecrew-plancritic
    - cavecrew-refactorer
    - cavecrew-reviewer
    - cavecrew-sentinel
    - cavecrew-simplifier
    - cavecrew-testrunner
    - cavecrew-testwright
  eager: preferred
  showResolvedModelBadge: true
  enableLsp: true
  isolation:
    mode: none
modelRoles:
  plan: anthropic/claude-fable-5:high
  slow: anthropic/claude-fable-5:high
  task: ollama-cloud/deepseek-v4-flash:high
  smol: ollama-cloud/minimax-m3
  tiny: ollama-cloud/gpt-oss:20b
  designer: ollama-cloud/minimax-m3:high
  vision: ollama-cloud/minimax-m3
  commit: ollama-cloud/gpt-oss:120b
  advisor: ollama-cloud/glm-5.2:high
  default: anthropic/claude-opus-5:high
modelProviderOrder:
  - anthropic
  - openai-codex
  - ollama-cloud
  - opencode-go
  - google-antigravity
contextPromotion:
  enabled: false
theme:
  dark: dark-catppuccin
symbolPreset: nerd
statusLine:
  preset: compact
  separator: powerline-thin
  showHookStatus: true
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
display:
  showTokenUsage: true
  shimmer: kitt
  cacheMissMarker: true
doubleEscapeAction: tree
renderMermaid:
  enabled: true
github:
  enabled: true
memory:
  backend: mnemopi
setupVersion: 1
terminal:
  showProgress: false
tui:
  textSizing: false
advisor:
  enabled: false
  syncBacklog: 3
steeringMode: one-at-a-time
interruptMode: immediate
stt:
  modelName: parakeet
  submitTrigger: never
  enabled: false
share:
  store: blob
magicKeywords:
  enabled: true
providers:
  memoryModel: online
  fireworksTier: standard
  tinyModel: online
  kimiApiFormat: auto
  autoThinkingMaxEffort: max
  ollama-cloud:
    maxConcurrency: 8
  webSearchOrder: []
retry:
  fallbackChains:
    ollama-cloud/*:
      - opencode-go/*
      - openai-codex/gpt-5.6-luna:high
    ollama-cloud/gpt-oss:20b:
      - ollama-cloud/minimax-m3
    ollama-cloud/gpt-oss:120b:
      - ollama-cloud/glm-5.2
      - opencode-go/glm-5.2
      - openai-codex/gpt-5.6-luna:high
    ollama-cloud/glm-5.2:
      # Task role + reviewer/debugger/evalsmith/fixscout all sit on this model,
      # so the same-model peer goes first: a transient ollama-cloud error must
      # not silently swap model family mid-task. Tail matches ollama-cloud/*.
      - opencode-go/glm-5.2
      - opencode-go/deepseek-v4-pro
      - openai-codex/gpt-5.6-luna:high
    openai-codex/gpt-5.6-luna:
      - ollama-cloud/glm-5.2:high
      - opencode-go/glm-5.2
    openai-codex/gpt-5.6-sol:
      - openai-codex/gpt-5.6-terra
      - anthropic/claude-opus-5:high
    anthropic/claude-fable-5:
      - openai-codex/gpt-5.6-sol:high
      - openai-codex/gpt-5.6-terra:high
    anthropic/*:
      - anthropic/claude-sonnet-5
      - openai-codex/gpt-5.6-terra:high
    default:
      - openai-codex/gpt-5.6-sol:high
mnemopi:
  dbPath: ""
  scoping: per-project
  proactiveLinking: true
  autoRetain: false
  injectionTokenLimit: 1500
  recallLimit: 3
  embeddingModel: ""
edit:
  mode: hashline
python:
  kernelMode: session
ruby:
  interpreter: ""
astGrep:
  enabled: true
checkpoint:
  enabled: true
commands:
  enableClaudeUser: true
defaultThinkingLevel: auto
hideThinkingBlock: true
dev:
  autoqaConsent: granted
bash:
  autoBackground:
    enabled: true
features:
  unexpectedStopDetection: true
compaction:
  idleEnabled: true
lsp:
  formatOnWrite: true
thinkingBudgets:
  max: 65536
tier:
  subagent: inherit
skills:
  # Minimal-guidance profile: skill auto-discovery off (adopted 2026-08-14,
  # see bench/README.md). Skill files stay on disk for reference; flip back to
  # true to restore discovery, at which point ignoredSkills below applies again.
  enabled: false
  # Load-bearing: all three exist under ~/.config/opencode/skills, which omp
  # discovers through the `opencode` provider (priority 55). Deleting the
  # vendored copy under agent/skills/ does NOT stop them loading.
  #   executing-plans -- superseded by subagent-driven-development
  #   caveman-help    -- duplicated by the /caveman-help slash command
  #   caveman-stats   -- opencode plugin hook, no omp equivalent
  ignoredSkills:
    - executing-plans
    - caveman-help
    - caveman-stats
