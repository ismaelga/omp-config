mnemopi:
  dbPath: ""
  scoping: per-project
  proactiveLinking: true
  autoRetain: false
  injectionTokenLimit: 1500
  recallLimit: 3
  embeddingModel: ""
edit:
  mode: hashline
python:
  kernelMode: session
ruby:
  interpreter: ""
astGrep:
  enabled: true
checkpoint:
  enabled: true
commands:
  enableClaudeUser: true
defaultThinkingLevel: auto
hideThinkingBlock: true
dev:
  autoqaConsent: granted
bash:
  autoBackground:
    enabled: true
  patterns:
    - match: rm -rf /
      approval: deny
    - match: rm -fr /
      approval: deny
    - match: rm -rf ~
      approval: deny
    - match: rm -fr ~
      approval: deny
    - match: rm -rf ~/
      approval: deny
    - match: rm -fr ~/
      approval: deny
    - match: rm -rf $HOME
      approval: deny
    - match: rm -fr $HOME
      approval: deny
    - match: rm -rf $HOME/
      approval: deny
    - match: rm -fr $HOME/
      approval: deny
    - match: "rm -rf ${HOME}"
      approval: deny
    - match: "rm -fr ${HOME}"
      approval: deny
    - match: "rm -rf ${HOME}/"
      approval: deny
    - match: "rm -fr ${HOME}/"
      approval: deny
    - match: git push --force
      approval: deny
    - match: git push --force *
      approval: deny
    - match: git push -f
      approval: deny
    - match: git push -f *
      approval: deny
    - match: git filter-branch*
      approval: deny
    - match: omp worktree clear*--all*
      approval: deny
    - match: omp wt clear*--all*
      approval: deny
features:
  unexpectedStopDetection: smart
compaction:
  idleEnabled: true
lsp:
  formatOnWrite: true
thinkingBudgets:
  max: 65536
textVerbosity: low
tier:
  subagent: inherit
skills:
  enabled: true
  enableSkillCommands: true
composer:
  shape: pi
codexResets:
  autoRedeem: "no"
worktree:
  base: ~/.herdr/worktrees
