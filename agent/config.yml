    - cavecrew-reviewer
    - cavecrew-sentinel
    - cavecrew-simplifier
    - cavecrew-testrunner
    - cavecrew-testwright
  eager: preferred
  showResolvedModelBadge: true
  enableLsp: true
  softRequestBudget: 100
  maxRuntimeMs: 1200000
  isolation:
    enabled: true
  agentModelOverrides:
    scout: "@scout"
    reviewer: "@critic"
    security-reviewer: "@sentinel"
