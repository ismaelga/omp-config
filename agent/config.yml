task: 
  agentModelOverrides: 
    # Bundled reviewer resolves @slow (gpt-5.6-sol). It was the only agent
    # drawing the Codex weekly window, which sits at 54% used. Terra is the
    # balanced tier of the same family on the same subscription; sol stays
    # reachable by switching to @slow deliberately.
    reviewer: openai-codex/gpt-5.6-terra:high
  disabledAgents: 
    # cavecrew-builder covers mechanical edits with a verifiable receipt and
    # cavecrew-refactorer covers the multi-file case. sonic's pinned model
    # also exposed no thinking levels, so its thinkingLevel was inert.
    - sonic
  eager: preferred
  showResolvedModelBadge: true
  enableLsp: true
  isolation: 
    mode: none
modelRoles: 
  default: anthropic/claude-opus-5:high
  plan: anthropic/claude-opus-5:high
  slow: openai-codex/gpt-5.6-sol:high
  task: ollama-cloud/glm-5.2:high
  smol: ollama-cloud/minimax-m3
  tiny: ollama-cloud/gpt-oss:20b
  designer: ollama-cloud/minimax-m3:high
  vision: ollama-cloud/minimax-m3
  commit: ollama-cloud/gpt-oss:120b
  advisor: ollama-cloud/minimax-m3:low
modelProviderOrder: 
  - anthropic
  - openai-codex
  - ollama-cloud
  - opencode-go
  - cursor
  - google-antigravity
contextPromotion: 
  enabled: true
theme: 
  dark: dark-catppuccin
symbolPreset: nerd
statusLine: 
  preset: compact
  separator: powerline-thin
  showHookStatus: true
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
display: 
  showTokenUsage: true
  shimmer: kitt
  cacheMissMarker: true
doubleEscapeAction: tree
memories: 
  enabled: false
renderMermaid: 
  enabled: true
github: 
  enabled: true
memory: 
  backend: mnemopi
setupVersion: 1
terminal: 
  showProgress: false
tui: 
  textSizing: false
advisor: 
  enabled: true
steeringMode: one-at-a-time
interruptMode: immediate
stt: 
  modelName: parakeet
  submitTrigger: never
  enabled: false
share: 
  store: blob
magicKeywords: 
  enabled: true
providers: 
  memoryModel: online
  fireworksTier: standard
  tinyModel: online
  kimiApiFormat: auto
  ollama-cloud: 
    maxConcurrency: 8
retry: 
  fallbackChains: 
    ollama-cloud/*: 
      - opencode-go/*
    ollama-cloud/gpt-oss:20b: 
      - ollama-cloud/minimax-m3
    ollama-cloud/glm-5.2: 
      - opencode-go/deepseek-v4-pro
      - opencode-go/glm-5.2
    openai-codex/gpt-5.6-sol: 
      - openai-codex/gpt-5.6-terra
      - anthropic/claude-opus-5:high
    anthropic/*: 
      - openai-codex/gpt-5.6-terra:high
      - ollama-cloud/glm-5.2:high
    designer: 
      - opencode-go/kimi-k3:high
      - ollama-cloud/glm-5.2:high
    opencode-go/kimi-k3: 
      - ollama-cloud/glm-5.2:high
      - ollama-cloud/minimax-m3
    default: 
      - openai-codex/gpt-5.6-sol:high
      - ollama-cloud/glm-5.2:high
mnemopi: 
  dbPath: ""
  scoping: per-project
  proactiveLinking: true
  embeddingModel: ""
edit: 
  mode: hashline
python: 
  kernelMode: session
ruby: 
  interpreter: ""
astGrep: 
  enabled: true
checkpoint: 
  enabled: true
commands: 
  enableClaudeUser: true
defaultThinkingLevel: auto
hideThinkingBlock: true
dev: 
  autoqaConsent: granted
bash: 
  autoBackground: 
    enabled: true
features: 
  unexpectedStopDetection: true
compaction: 
  idleEnabled: true
lsp: 
  formatOnWrite: true
thinkingBudgets: 
  max: 65536
tier: 
  subagent: flex