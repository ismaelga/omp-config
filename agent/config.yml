task:
  disabledAgents:
    - sonic
    - momus
    - cavecrew-benchwright
    - cavecrew-builder
    - cavecrew-challenger
    - cavecrew-debugger
    - cavecrew-fixscout
    - cavecrew-githistorian
    - cavecrew-investigator
    - cavecrew-plancritic
    - cavecrew-refactorer
    - cavecrew-reviewer
    - cavecrew-sentinel
    - cavecrew-simplifier
    - cavecrew-testrunner
    - cavecrew-testwright
  eager: preferred
  showResolvedModelBadge: true
  enableLsp: true
  softRequestBudget: 100
  maxRuntimeMs: 1200000
  isolation:
    enabled: true
  agentModelOverrides:
    scout: "@scout"
    reviewer: "@critic"
    security-reviewer: "@sentinel"
modelRoles:
  plan: anthropic/claude-fable-5-1:high
  slow: anthropic/claude-fable-5-1:high
  task: ollama-cloud/glm-5.3-flash:high
  smol: zai/glm-5.3-flash:high
  tiny: ollama-cloud/gpt-oss:120b
  vision: zai/glm-5.3-flash:high
  commit: ollama-cloud/gpt-oss:120b
  advisor: zai/glm-5.3-flash:high
  default: anthropic/claude-opus-5:xhigh
  scout: zai/glm-5.3-flash:high
  critic: openai-codex/gpt-6-astra:high
  sentinel: opencode-go/glm-5.3:high
modelProviderOrder:
  - zai
  - anthropic
  - ollama-cloud
  - opencode-go
  - openrouter
contextPromotion:
  enabled: false
theme:
  dark: dark-catppuccin
symbolPreset: nerd
statusLine:
  preset: compact
  separator: powerline-thin
  showHookStatus: true
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
display:
  showTokenUsage: true
  shimmer: kitt
  cacheMissMarker: true
doubleEscapeAction: tree
renderMermaid:
  enabled: true
github:
  enabled: true
memory:
  backend: mnemopi
setupVersion: 2
terminal:
  showProgress: false
tui:
  textSizing: false
advisor:
  enabled: true
  syncBacklog: "off"
steeringMode: one-at-a-time
interruptMode: immediate
stt:
  modelName: parakeet
  submitTrigger: never
  enabled: false
share:
  store: blob
magicKeywords:
  enabled: true
providers:
  memoryModel: online
  fireworksTier: standard
  tinyModel: online
  kimiApiFormat: auto
  autoThinkingMaxEffort: max
  ollama-cloud:
    maxConcurrency: 8
  webSearchOrder:
    - public
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
retry:
  usageAwareFallback: true
  usageReservePolicy: auto
  usageReservePct: 10
  fallbackChains:
    ollama-cloud/deepseek-v4.1-flash:
      - opencode-go/deepseek-v4.1-flash:low
      - ollama-cloud/glm-5.3-flash:high
      - zai/glm-5.3-flash:high
      - openai-codex/gpt-5.6-luna:high
      - anthropic/claude-opus-5:high
    zai/glm-5.3-flash:
      - ollama-cloud/glm-5.3-flash:high
      - opencode-go/glm-5.3-flash:high
      - ollama-cloud/deepseek-v4.1-flash:low
      - openai-codex/gpt-5.6-luna:high
      - anthropic/claude-opus-5:high
    ollama-cloud/glm-5.3-flash:
      - opencode-go/glm-5.3-flash:high
      - ollama-cloud/deepseek-v4.1-flash:low
      - openai-codex/gpt-5.6-luna:high
      - anthropic/claude-opus-5:high
    ollama-cloud/glm-5.3:
      - opencode-go/glm-5.3:high
      - zai/glm-5.3:high
      - openai-codex/gpt-6-astra:high
    opencode-go/glm-5.3:
      - ollama-cloud/glm-5.3:high
      - zai/glm-5.3:high
      - openai-codex/gpt-5.6-terra:high
    openai-codex/gpt-6-astra:
      - openai-codex/gpt-5.6-terra:high
      - anthropic/claude-opus-5:high
      - ollama-cloud/glm-5.3:high
    ollama-cloud/gpt-oss:120b:
      - ollama-cloud/glm-5.3-flash:high
      - opencode-go/glm-5.3-flash:high
      - openai-codex/gpt-5.6-luna:high
    anthropic/claude-fable-5-1:
      - openai-codex/gpt-6-astra:high
      - openai-codex/gpt-5.6-sol:high
      - anthropic/claude-opus-5:xhigh
    anthropic/*:
      - openai-codex/gpt-5.6-sol:high
      - openai-codex/gpt-5.6-terra:high
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
    ollama-cloud/*:
      - opencode-go/*
      - openai-codex/gpt-5.6-luna:high
      - zai/glm-5.3:high
    opencode-go/*:
      - ollama-cloud/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
    zai/*:
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
    openai-codex/gpt-5.6-luna:
      - ollama-cloud/glm-5.3-flash:high
      - opencode-go/glm-5.3-flash:high
      - zai/glm-5.3:high
    openai-codex/gpt-5.6-terra:
      - openai-codex/gpt-5.6-luna:high
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
    openai-codex/gpt-5.6-sol:
      - openai-codex/gpt-6-astra:high
      - anthropic/claude-opus-5:high
      - ollama-cloud/glm-5.3:high
    openrouter/*:
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
    default:
      - ollama-cloud/glm-5.3:high
      - openai-codex/gpt-5.6-sol:high
      - anthropic/claude-opus-5:high
mnemopi:
  dbPath: ""
  scoping: per-project
  proactiveLinking: true
  autoRetain: false
  injectionTokenLimit: 1500
  recallLimit: 3
  embeddingModel: ""
edit:
  mode: hashline
python:
  kernelMode: session
ruby:
  interpreter: ""
astGrep:
  enabled: true
checkpoint:
  enabled: true
commands:
  enableClaudeUser: true
defaultThinkingLevel: auto
hideThinkingBlock: false
dev:
  autoqaConsent: granted
bash:
  autoBackground:
    enabled: true
features:
  unexpectedStopDetection: smart
compaction:
  idleEnabled: true
lsp:
  formatOnWrite: true
thinkingBudgets:
  max: 65536
textVerbosity: low
tier:
  subagent: inherit
skills:
  enabled: true
  enableSkillCommands: true
composer:
  shape: pi
codexResets:
  autoRedeem: "no"