auth:
  accountPolicies:
    # Weekly plan window is soft while usage credits are enabled (extra_usage.is_enabled,
    # EUR 250 cap at 59.5% on 2026-10-28) but omp's reserve gate only reads seven_day
    # utilization (96%). reservePct 0 keeps this account primary into that soft zone
    # instead of rerouting at the global 10% reserve. Drop the override if extra usage
    # is disabled again (2026-11-02 headers: overage rejected, member_zero_credit_limit).
    - provider: anthropic
      account:
        email: ismael@karpatkey.com
        orgId: dbfa7ecc-cfc5-4df3-b4ac-f9efd2c96173
      priority: 10
      reservePct: 0
      reclaimAbovePct: 20
    - provider: anthropic
      account:
        email: ismael.claude@karpatkey.com
      priority: 0
      # 2026-11-02: this seat used to inherit the global reservePct 10 and sat
      # policy.state "inside-reserve" at 9% remaining (7d window), so when the
      # primary's 7d window hit 1.0 used (usage_history, resets 11-05) the
      # preflight found no healthy anthropic credential and walked anthropic/*'s
      # model chain to ollama-cloud/glm-5.3 (session 01a19d35, role:"fallback",
      # no anthropic request ever sent). With reservePct 0 the failover works:
      # a print-mode opus turn at 17:09 stayed on anthropic and pinned
      # credential 27 (this account, session credential_pin hash a5297844...).
      # Note: omp usage's display currently mislabels the buckets (its
      # "ismael@" row carries this account's reset times 20:40/11-06); the
      # router's usage_history rows are the accurate source. Quota is per-seat:
      # primary 7d exhausted while this seat's 7d read 0.16 the same minute.
      reservePct: 0
retry:
  usageAwareFallback: true
  usageReservePolicy: auto
  usageReservePct: 10
  fallbackChains:
    # TEMPORARY 2026-11-04: healthy hop first in the chains role pins actually
    # hit. usage_history: zai weekly exhausted (resets 2026-11-07), ollama-cloud
    # and opencode-go monthly exhausted (reset 2026-11-16); openrouter answers
    # 402 Insufficient credits. Every GLM-role call was burning three failed
    # requests before landing on gpt-6-luna. Revert these five chains
    # (zai/glm-5.3-flash, anthropic/claude-opus-5-5, anthropic/*, critic,
    # default) to same-weights-first once ollama-cloud/opencode-go reset or
    # openrouter is funded.
    zai/glm-5.3-flash:
      - openai-codex/gpt-6-luna
      - openrouter/z-ai/glm-5.3-flash
      - ollama-cloud/*
      - opencode-go/*
      - anthropic/claude-haiku-5-5
    zai/glm-5.3:
      - openrouter/z-ai/glm-5.3
      - ollama-cloud/*
      - opencode-go/*
    zai/*:
      - ollama-cloud/*
      - opencode-go/*
    ollama-cloud/deepseek-v4.1-flash:1017:
      - zai/glm-5.3-flash:high
      - openrouter/deepseek/deepseek-v4.1-flash-1017:low
      - opencode-go/deepseek-v4.1-flash:low
      - ollama-cloud/glm-5.3-flash:high
      - opencode-go/glm-5.3-flash:high
    ollama-cloud/glm-5.3-flash:
      - zai/glm-5.3-flash:high
      - openrouter/z-ai/glm-5.3-flash:high
      - opencode-go/glm-5.3-flash:high
      - openai-codex/gpt-6-luna:high
    ollama-cloud/glm-5.3:
      - zai/glm-5.3:high
      - openrouter/z-ai/glm-5.3:high
      - opencode-go/glm-5.3:high
    opencode-go/glm-5.3:
      - zai/glm-5.3:high
      - openrouter/z-ai/glm-5.3:high
      - ollama-cloud/glm-5.3:high
    ollama-cloud/gpt-oss:120b:
      - openrouter/openai/gpt-oss-120b:low
      - ollama-cloud/glm-5.3-flash:low
      - opencode-go/glm-5.3-flash:low
      - openai-codex/gpt-6-luna:low
    anthropic/claude-opus-5-5:
      - openai-codex/gpt-6.1-sol
      - ollama-cloud/glm-5.3:high
    anthropic/*:
      - openai-codex/gpt-6.1-sol
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
    anthropic/claude-sonnet-5-5:
      - openai-codex/gpt-6.1-sol:high
      - ollama-cloud/kimi-k3:high
    critic:
      - anthropic/claude-sonnet-5-5:high
      - ollama-cloud/kimi-k3:high
    ollama-cloud/*:
      - zai/glm-5.3:high
