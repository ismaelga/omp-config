bash:
  autoBackground:
    enabled: true
  # 2026-09-23 (docs/plans/2026-09-20-jev-guard-adoption.md Task 1): yolo drops
  # bash's built-in critical-pattern override, but an explicit `deny` here is
  # absolute in every mode and in headless subagents. The rm forms are exact
  # (no `*`), so they match only the literal catastrophe. `git push --force*`
  # also catches --force-with-lease -- accepted: force pushes are run by hand.
  # No `prompt` rules: a prompt in a headless subagent rejects the call.
  # Malformed entries are dropped silently -- `omp config get bash.patterns |
  # jq length` must read 11.
  patterns:
    - match: "rm -rf /"
      approval: deny
    - match: "rm -fr /"
      approval: deny
    - match: "rm -rf ~"
      approval: deny
    - match: "rm -fr ~"
      approval: deny
    - match: "rm -rf $HOME"
      approval: deny
    - match: "rm -fr $HOME"
      approval: deny
    - match: "rm -rf ${HOME}"
      approval: deny
    - match: "rm -fr ${HOME}"
      approval: deny
    - match: "git push --force*"
      approval: deny
    - match: "git push -f*"
      approval: deny
    - match: "git filter-branch*"
      approval: deny
