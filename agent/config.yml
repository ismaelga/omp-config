  slow: anthropic/claude-opus-5-5:high
  smol: zai/glm-5.3-flash:high
  tiny: ollama-cloud/gpt-oss:120b
  vision: zai/glm-5.3-flash:high
  commit: ollama-cloud/gpt-oss:120b
  advisor: zai/glm-5.3-flash:high
  default: anthropic/claude-opus-5-5:xhigh
  scout: zai/glm-5.3-flash:high
  critic: openai-codex/gpt-6-astra:high
  sentinel: zai/glm-5.3:high
  judge: typesafe/jev-1.13.0
  web: web/public
  task: zai/glm-5.3-flash:high
modelProviderOrder:
  - zai
  - anthropic
  - ollama-cloud
  - opencode-go
  - openrouter
contextPromotion:
  enabled: false
theme:
  dark: dark-catppuccin
symbolPreset: nerd
statusLine:
  preset: compact
  separator: powerline-thin
  showHookStatus: true
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
display:
  showTokenUsage: true
  shimmer: kitt
  cacheMissMarker: true
doubleEscapeAction: tree
renderMermaid:
  enabled: true
github:
  enabled: true
memory:
  backend: mnemopi
setupVersion: 2
terminal:
  showProgress: false
tui:
  textSizing: false
advisor:
  enabled: true
  syncBacklog: "off"
steeringMode: one-at-a-time
interruptMode: immediate
stt:
  submitTrigger: never
  enabled: false
share:
  store: blob
magicKeywords:
  enabled: true
providers:
  fireworksTier: standard
  kimiApiFormat: auto
  autoThinkingMaxEffort: max
  ollama-cloud:
    maxConcurrency: 8
retry:
  usageAwareFallback: true
  usageReservePolicy: auto
  usageReservePct: 10
  fallbackChains:
    # 2026-09-24, roles moved zai-primary (ollama-cloud hit its monthly wall,
    # ref fbcfe476): no fallback off zai. omp 18.3.0 consults the owning chain
    # on the FIRST retryable 429, so a transient type=1302 request-rate burst
    # (67 hits in session logs -- the parallel-batch error) hops providers
    # instead of riding the built-in 30s rate-limit backoff. Empty chain =
    # backoff-only: 1302 waits 30s and retries; 1308/1310 quota waits exceed
    # retry.maxDelayMs (5 min) and fail the turn fast, which beats silently
    # burning anthropic opus -- and every hop in the old chain was 429/402-dead
    # on 2026-09-24 anyway. No providers.zai.maxConcurrency exists in 18.3.0
    # (the provider semaphore map wires ollama-cloud only), so parallel width
    # is capped at dispatch time, not in config.
    zai/*: []
    ollama-cloud/glm-5.3-flash:
      - zai/glm-5.3-flash:high
      - opencode-go/glm-5.3-flash:high
      - openai-codex/gpt-5.6-luna:high
      - anthropic/claude-opus-5-5:high
    ollama-cloud/glm-5.3:
      - opencode-go/glm-5.3:high
      - zai/glm-5.3:high
      - openai-codex/gpt-6-astra:high
    opencode-go/glm-5.3:
      - ollama-cloud/glm-5.3:high
      - zai/glm-5.3:high
      - openai-codex/gpt-5.6-terra:high
    openai-codex/gpt-6-astra:
      - openai-codex/gpt-5.6-terra:high
      - anthropic/claude-opus-5-5:high
      - ollama-cloud/glm-5.3:high
    ollama-cloud/gpt-oss:120b:
      - ollama-cloud/glm-5.3-flash:high
      - opencode-go/glm-5.3-flash:high
      - openai-codex/gpt-5.6-luna:high
    anthropic/claude-opus-5-5:
      - openai-codex/gpt-6-astra:high
      - openai-codex/gpt-5.6-sol:high
      - ollama-cloud/glm-5.3:high
    anthropic/*:
      - openai-codex/gpt-5.6-sol:high
      - openai-codex/gpt-5.6-terra:high
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
    ollama-cloud/*:
      - opencode-go/*
      - openai-codex/gpt-5.6-luna:high
      - zai/glm-5.3:high
    opencode-go/*:
      - ollama-cloud/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
    openai-codex/gpt-5.6-luna:
      - ollama-cloud/glm-5.3-flash:high
      - opencode-go/glm-5.3-flash:high
      - zai/glm-5.3:high
    openai-codex/gpt-5.6-terra:
      - openai-codex/gpt-5.6-luna:high
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
    openai-codex/gpt-5.6-sol:
      - openai-codex/gpt-6-astra:high
      - anthropic/claude-opus-5-5:high
      - ollama-cloud/glm-5.3:high
    openrouter/*:
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
    default:
      - ollama-cloud/glm-5.3:high
      - openai-codex/gpt-5.6-sol:high
      - anthropic/claude-opus-5-5:high
    web:
      - web/perplexity
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-5.6-luna
      - xai/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai-oauth/grok-4.5
      - web/ollama
mnemopi:
  dbPath: ""
  scoping: per-project
  proactiveLinking: true
  autoRetain: false
  injectionTokenLimit: 1500
  recallLimit: 3
  embeddingModel: ""
edit:
  mode: hashline
python:
  kernelMode: session
ruby:
  interpreter: ""
astGrep:
  enabled: true
checkpoint:
  enabled: true
commands:
  enableClaudeUser: true
defaultThinkingLevel: auto
hideThinkingBlock: true
dev:
  autoqaConsent: granted
bash:
  autoBackground:
    enabled: true
  patterns:
    - match: rm -rf /
      approval: deny
    - match: rm -fr /
      approval: deny
    - match: rm -rf ~
      approval: deny
    - match: rm -fr ~
      approval: deny
    - match: rm -rf ~/
      approval: deny
    - match: rm -fr ~/
      approval: deny
    - match: rm -rf $HOME
      approval: deny
    - match: rm -fr $HOME
      approval: deny
    - match: rm -rf $HOME/
      approval: deny
    - match: rm -fr $HOME/
      approval: deny
    - match: "rm -rf ${HOME}"
      approval: deny
    - match: "rm -fr ${HOME}"
      approval: deny
    - match: "rm -rf ${HOME}/"
      approval: deny
    - match: "rm -fr ${HOME}/"
      approval: deny
    - match: git push --force
      approval: deny
    - match: git push --force *
      approval: deny
    - match: git push -f
      approval: deny
    - match: git push -f *
      approval: deny
    - match: git filter-branch*
      approval: deny
features:
  unexpectedStopDetection: smart
compaction:
  idleEnabled: true
lsp:
  formatOnWrite: true
thinkingBudgets:
  max: 65536
textVerbosity: low
tier:
  subagent: inherit
skills:
  enabled: true
  enableSkillCommands: true
composer:
  shape: pi
codexResets:
  autoRedeem: "no"
