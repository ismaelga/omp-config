retry:
  # Proactive spill, 2026-09-14. `fallbackChains` below is REACTIVE: it needs a
  # failure first, and z.ai's quota wall arrives as a 429 the session has to eat
  # before it moves. This preflights the coding-plan usage report instead and
  # switches while the plan still has credit. Mechanism, read out of the shipped
  # binary rather than assumed: the preflight calls getModelUsageHealth(provider)
  # per request, and on state `reserve` (remaining < usageReservePct) or
  # `depleted` it walks this role's chain keys, skipping any candidate whose own
  # usage reads reserve/depleted, and requiring configured auth, a compatible
  # thinking ceiling and a context that fits. `unknown` fails open on BOTH ends:
  # it never switches away from a provider it cannot read, and it accepts a
  # candidate it cannot read -- which is exactly the ollama-cloud case, since
  # that provider reports no limits at all (`omp usage`, 2026-09-14).
  # So zai (credit-metered, reported) spills to ollama-cloud (flat, unreported)
  # before the wall instead of after it.
  usageAwareFallback: true
  # `auto`, not the `confirm` default: `confirm` only asks where there is a
  # confirmation UI, and subagents have none -- they auto-apply already. The
  # prompt would therefore land only on the main turn, to ask whether to move to
  # identical weights on a flat provider. That is not a decision worth a
  # keystroke. `fail-closed` is the opposite trade and is refused: it turns a
  # spent plan into a hard error while a working route sits in the chain.
  usageReservePolicy: auto
  # 10% is the default and stays: the reserve exists so an interactive turn is
  # not cut off mid-tool-call, and zai lite's week is 10K credits, so 10% is
  # 1K credits of runway.
  usageReservePct: 10
  fallbackChains:
    # Reachability first, price second, as of 2026-09-11. Both of the previous
    # pass's degraded providers recovered on the same day: z.ai's lite plan reads
    # 0/2K five-hour and 0/10K weekly credits (omp usage), and the OpenRouter key
    # was topped up to $19.91 remaining, with the 8000-token reasoning shape that
    # 402'd on 2026-09-10 now answering 200. The chains below still keep metered
    # openrouter off every hop, because every role here is served by a flat plan
    # and a restored balance is not a reason to spend it.
    # Rules that outlive any one outage: same weights on the cheaper provider
    # first; every link reachable from a role that sends images must accept image
    # input, or a retry silently blinds it; the tail must not downgrade the role
    # that overflowed into it; exhausted or metered routes last.
    #
    # Heads for the roles pinned in modelRoles above.
    # zai/glm-5.3-flash carries scout, smol, vision and advisor since
    # 2026-09-14, so every link must accept image input AND write code. hop 1 is
    # the identical weights on the flat, uncapped provider -- which is also the
    # answer to the two failures this pin makes likely: zai's credit bucket
    # emptying, and its ~4-concurrent rate limit under a fan-out. hop 2 is the
    # third copy of those same weights. hop 3 is deepseek-v4.1-flash, probed for
    # image input on the wire (Red/Blue, 2026-09-11) because this head serves
    # `vision`; it is the only non-GLM link before the tail.
    # This head is load-bearing, not decoration: without it `zai/*` catches the
    # four roles and sends them to ollama-cloud/glm-5.3, which is TEXT-ONLY --
    # precisely the silent blinding the rule above warns about.
    # deepseek at :low, not :high -- its verbosity is reasoning, not answer. On
    # the bakeoff diff problem the answer is ~1K tokens at every tier while
    # reasoning runs 14-30K, so a terser prompt cannot reach it (measured
    # 2026-09-11; a terse system prompt left the answer at ~1K and moved total
    # tokens 18K/40K across two samples -- noise). The effort tier does reach it.
    # Measured on the diff problem, all 2026-09-11, all 4/4 correct:
    #   :low  n=4, par-4 today      19.1 / 19.1 / 23.9 / 24.8K out, median 111 s
    #   :high n=2, par-4 today      33.6 / 39.9K out,              median 155 s
    #   :high n=4, archived bakeoff 24.0 / 27.7 / 32.1 / 36.9K out, 6 workers
    # Token counts do not depend on concurrency, so the tiers are comparable
    # across those regimes: one inversion in 24 pairs. Wall clock does depend on
    # it, so the 111 s vs 155 s figure is same-condition (par-4) only. Across
    # regimes the wall times move the other way -- archived 6-worker high runs
    # median 118 s against today's par-4 high 155 s -- which is day-to-day route
    # variance, not a concurrency effect worth reading into. It does mean the
    # route was slower today, so the same-condition :low figure is conservative
    # rather than flattered.
    # Both as a link and as `task`'s pinned tier, :low is the measured choice,
    # and the 2026-09-14 re-run settled the correctness half the 09-11 numbers
    # could not. Three problems x 3 samples per tier, execution-scored:
    #   :low    9/9  median 142.6 s  median 16.0K out  worst 22.4K
    #   :medium 9/9  median 146.7 s  median 25.8K out  worst 49.2K
    #   :high   7/9  median 200.8 s  median 34.0K out  worst 61.1K
    # The tiers are real, not aliases: `omp bench <id>:<tier> --json` echoes the
    # resolved level, and minimal/low/medium/high each survive round-trip while
    # :max silently resolves to high (2026-09-14). That matches the catalog --
    # ollama-cloud.kdl:5 gives class "unknown" [minimal, low, medium, high], and
    # the [low, high, max] row at kdl:9 names only deepseek-v4-pro:preview, not
    # this id. Worth knowing before trusting any tier comparison on this route.
    # :minimal measured 2026-09-15 and rejected -- it is NOT a lower floor.
    # Same diff problem, n=3/tier, `omp bench <id>:<tier> --profile chat
    # --prompt <DIFF_SPEC> --runs 3 --max-tokens 65536 --par 6 --json`:
    #   :minimal  out 18452/21261/23853  mean 21.2K  duration p50 230.7 s
    #   :low      out  9381/19201/21798  mean 16.8K  duration p50 184.3 s
    # Read the TOKEN columns, not the durations: per the same-regime rule at
    # :478 above, wall clock does not transfer across concurrency regimes. Both
    # tiers here ran inside one --par 6 invocation, so the 230.7 vs 184.3 s is
    # a valid same-condition pair and nothing more -- do not compare it to the
    # 142.6 s figure at :490, which was measured under a different harness.
    # Both echo their own `thinking` back, so this is a real tier and not the
    # GLM-style ladder collapse warned about at the top of this file. The
    # ranges overlap, so the honest read is "no reduction", not ":minimal is
    # worse" -- but it is certainly not the cut it was a candidate for. Volume
    # is flat minimal->low exactly as correctness is flat low->medium: the
    # effort knob has a floor and :low sits on it. Reasoning volume on this id
    # is not tier-addressable, which is the same wall a terser system prompt
    # hit (see above). Do not re-run this hoping for a cheaper tier.
    # Correctness is flat from :low to :medium and then falls, so nothing here
    # buys anything above the floor. The tiebreaker is the output budget: this
    # id is capped at 65536 on ollama-cloud (see models.yml), and :high's worst
    # run spent 93% of it, :medium's 75%, :low's 34%. Cloud rows set
    # omitMaxOutputTokens, so that ceiling is not a wire cut -- it is the
    # budgeting number, and the real cost is that reasoning tokens occupy the
    # subagent's own window. A task harder than these three -- the case for
    # more thinking -- is where the upper tiers enter that pressure and the
    # floor still has room. :high's two failures were one malformed hunk header
    # after 42.8K tokens and one 1500 s timeout, neither a truncation.
    # Note this pin is a hard fix, not a floor: applyAutoThinkingLevel returns
    # early unless the session is in auto mode, and any explicit suffix clears
    # that flag, so a subagent cannot escalate itself on a hard task. Accepted
    # deliberately -- the measurement says escalation is the wrong direction.
    # Revert only against a re-run, not against one bad turn.
    # `task`'s head until the 2026-09-15 user call; kept for the zai chain's
    # hop 3 and explicit --model selectors. hop 1 is the same weights on the
    # other flat plan -- opencode-go serves this id at 384K output against
    # ollama-cloud's 66K, and its DeepSeek region gate lifted on 2026-09-11.
    # Then the GLM siblings, zai first per the provider rule above. Every link
    # takes image input, because subagents read screenshots.
    ollama-cloud/deepseek-v4.1-flash:
      - opencode-go/deepseek-v4.1-flash:low
      - ollama-cloud/glm-5.3-flash:high
      - zai/glm-5.3-flash:high
      - openai-codex/gpt-5.6-luna:high
      - anthropic/claude-opus-5:high
    zai/glm-5.3-flash:
      - ollama-cloud/glm-5.3-flash:high
      - opencode-go/glm-5.3-flash:high
      - ollama-cloud/deepseek-v4.1-flash:low
      - openai-codex/gpt-5.6-luna:high
      - anthropic/claude-opus-5:high
    # `task`'s head since 2026-09-15; also reached as hop 1 above and by an
    # explicit --model selector. Carries no zai link on purpose: a turn arrives
    # here either pinned or because zai refused, so sending it back is a hop
    # spent on a route already known to be down.
    ollama-cloud/glm-5.3-flash:
      - opencode-go/glm-5.3-flash:high
      - ollama-cloud/deepseek-v4.1-flash:low
      - openai-codex/gpt-5.6-luna:high
      - anthropic/claude-opus-5:high
    # glm-5.3 carries no role since the librarian agent was removed upstream. The
    # head stays for the same reason openrouter/* does: an explicit --model
    # selection still needs somewhere to land.
    ollama-cloud/glm-5.3:
      - opencode-go/glm-5.3:high
      - zai/glm-5.3:high
      - openai-codex/gpt-6-astra:high
    opencode-go/glm-5.3:
      - ollama-cloud/glm-5.3:high
      - zai/glm-5.3:high
      - openai-codex/gpt-5.6-terra:high
    openai-codex/gpt-6-astra:
      - openai-codex/gpt-5.6-terra:high
      - anthropic/claude-opus-5:high
      - ollama-cloud/glm-5.3:high
    ollama-cloud/gpt-oss:120b:
      - ollama-cloud/glm-5.3-flash:high
      - opencode-go/glm-5.3-flash:high
      - openai-codex/gpt-5.6-luna:high
    anthropic/claude-fable-5-1:
      - openai-codex/gpt-6-astra:high
      - openai-codex/gpt-5.6-sol:high
      - anthropic/claude-opus-5:xhigh
    anthropic/*:
      - openai-codex/gpt-5.6-sol:high
      - openai-codex/gpt-5.6-terra:high
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
    #
    # Provider-level heads. deepseek is back in the chains as of 2026-09-11, on
    # two findings that both reversed: ollama-cloud now serves V4.1-Flash (4/4 on
    # the bakeoff, against 0/4 for the V4-Flash it replaces), and opencode-go's
    # DeepSeek region gate has lifted -- deepseek-v4.1-flash answered OK through
    # the session path where the ids 403'd "requires explicit opt in" on
    # 2026-09-01, which matches DeepSeek naming OpenCode an official partner in
    # the V4.1-Flash announcement. openrouter/deepseek/* stays behind the credit
    # gate and so stays off every chain.
    ollama-cloud/*:
      - opencode-go/*
      - openai-codex/gpt-5.6-luna:high
      - zai/glm-5.3:high
    opencode-go/*:
      - ollama-cloud/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
    zai/*:
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
    openai-codex/gpt-5.6-luna:
      - ollama-cloud/glm-5.3-flash:high
      - opencode-go/glm-5.3-flash:high
      - zai/glm-5.3:high
    openai-codex/gpt-5.6-terra:
      - openai-codex/gpt-5.6-luna:high
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
    openai-codex/gpt-5.6-sol:
      - openai-codex/gpt-6-astra:high
      - anthropic/claude-opus-5:high
      - ollama-cloud/glm-5.3:high
    # The openrouter head survives so an explicit --model selector still has
    # somewhere to land while the key is empty; its links point off openrouter.
    openrouter/*:
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
    default:
      - ollama-cloud/glm-5.3:high
      - openai-codex/gpt-5.6-sol:high
      - anthropic/claude-opus-5:high
