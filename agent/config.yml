task:
  disabledAgents:
    - sonic
    - momus
    - cavecrew-benchwright
    - cavecrew-builder
    - cavecrew-challenger
    - cavecrew-debugger
    - cavecrew-fixscout
    - cavecrew-githistorian
    - cavecrew-investigator
    - cavecrew-plancritic
    - cavecrew-refactorer
    - cavecrew-reviewer
    - cavecrew-sentinel
    - cavecrew-simplifier
    - cavecrew-testrunner
    - cavecrew-testwright
  eager: preferred
  showResolvedModelBadge: true
  enableLsp: true
  softRequestBudget: 100
  maxRuntimeMs: 5400000
  isolation:
    enabled: true
  agentModelOverrides:
    task: "@task"
    scout: "@scout"
    reviewer: "@critic"
    security-reviewer: "@sentinel"
modelRoles:
  plan: anthropic/claude-opus-5-5:high
  slow: anthropic/claude-opus-5-5:high
  smol: zai/glm-5.3-flash:high
  tiny: zai/glm-5.3-flash:low
  vision: zai/glm-5.3-flash:high
  commit: zai/glm-5.3-flash:low
  advisor: zai/glm-5.3-flash:high
  default: anthropic/claude-opus-5-5:xhigh
  scout: zai/glm-5.3-flash:high
  critic: openai-codex/gpt-6-astra:high
  sentinel: zai/glm-5.3:high
  judge: typesafe/jev-1.14.0
  web: web/public
  task: zai/glm-5.3-flash:high
modelProviderOrder:
  - zai
  - anthropic
  - ollama-cloud
  - opencode-go
  - openrouter
contextPromotion:
  enabled: false
theme:
  dark: dark-catppuccin
symbolPreset: nerd
statusLine:
  preset: compact
  separator: powerline-thin
  showHookStatus: true
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
display:
  showTokenUsage: true
  shimmer: kitt
  cacheMissMarker: true
doubleEscapeAction: tree
renderMermaid:
  enabled: true
github:
  enabled: true
memory:
  backend: mnemopi
setupVersion: 2
terminal:
  showProgress: false
tui:
  textSizing: false
advisor:
  enabled: true
  syncBacklog: "off"
steeringMode: one-at-a-time
interruptMode: immediate
stt:
  submitTrigger: never
  enabled: false
share:
  store: blob
magicKeywords:
  enabled: true
providers:
  fireworksTier: standard
  kimiApiFormat: auto
  autoThinkingMaxEffort: max
  ollama-cloud:
    maxConcurrency: 8
auth:
  accountPolicies:
    # Weekly plan window is soft while usage credits are enabled (extra_usage.is_enabled,
    # EUR 250 cap at 59.5% on 2026-10-28) but omp's reserve gate only reads seven_day
    # utilization (96%). reservePct 0 stops it rerouting the only healthy provider onto
    # dead ones. Drop this entry if extra usage is ever disabled again.
    - provider: anthropic
      account:
        email: ismael@karpatkey.com
      reservePct: 0

retry:
  usageAwareFallback: true
  usageReservePolicy: auto
  usageReservePct: 10
  fallbackChains:
    zai/*:
      - ollama-cloud/*
      - opencode-go/*
    # task head chain: cheap/flat-plan links only — subagent volume must not
    # drain the anthropic plan the interactive session runs on (opus removed 2026-10-23).
    ollama-cloud/deepseek-v4.1-flash:1017:
      - opencode-go/deepseek-v4.1-flash:low
      - ollama-cloud/glm-5.3-flash:high
      - opencode-go/glm-5.3-flash:high
      - zai/glm-5.3-flash:high
    ollama-cloud/glm-5.3-flash:
      - zai/glm-5.3-flash:high
      - opencode-go/glm-5.3-flash:high
      - openai-codex/gpt-5.6-luna:high
    # astra tail cut 2026-10-23: cheap-role cascades (task/scout via opencode-go/*
    # and zai/*) land here; astra's chain carries opus. Premium walks keep astra via sol/terra.
    ollama-cloud/glm-5.3:
      - opencode-go/glm-5.3:high
      - zai/glm-5.3:high
    opencode-go/glm-5.3:
      - ollama-cloud/glm-5.3:high
      - zai/glm-5.3:high
      - openai-codex/gpt-5.6-terra:high
    openai-codex/gpt-6-astra:
      - openai-codex/gpt-5.6-terra:high
      - anthropic/claude-opus-5-5:high
      - ollama-cloud/glm-5.3:high
    ollama-cloud/gpt-oss:120b:
      - ollama-cloud/glm-5.3-flash:low
      - opencode-go/glm-5.3-flash:low
      - openai-codex/gpt-5.6-luna:low
    anthropic/claude-opus-5-5:
      - openai-codex/gpt-6-astra:high
      - openai-codex/gpt-5.6-sol:high
      - ollama-cloud/glm-5.3:high
    anthropic/*:
      - openai-codex/gpt-5.6-sol:high
      - openai-codex/gpt-5.6-terra:high
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
    ollama-cloud/*:
      - opencode-go/*
      - openai-codex/gpt-5.6-luna:high
      - zai/glm-5.3:high
    opencode-go/*:
      - ollama-cloud/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
    openai-codex/gpt-5.6-luna:
      - ollama-cloud/glm-5.3-flash:high
      - opencode-go/glm-5.3-flash:high
      - zai/glm-5.3:high
    openai-codex/gpt-5.6-terra:
      - openai-codex/gpt-5.6-luna:high
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
    openai-codex/gpt-5.6-sol:
      - openai-codex/gpt-6-astra:high
      - anthropic/claude-opus-5-5:high
      - ollama-cloud/glm-5.3:high
    openrouter/*:
      - ollama-cloud/glm-5.3:high
      - opencode-go/glm-5.3:high
      - openai-codex/gpt-5.6-luna:high
    default:
      - ollama-cloud/glm-5.3:high
      - openai-codex/gpt-5.6-sol:high
      - anthropic/claude-opus-5-5:high
    web:
      - web/perplexity
      - google-gemini-cli/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-5.6-luna
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai-oauth/grok-4.5
      - web/ollama
mnemopi:
  dbPath: ""
  scoping: per-project
  proactiveLinking: true
  autoRetain: false
  injectionTokenLimit: 1500
  recallLimit: 3
  embeddingModel: ""
edit:
  mode: hashline
python:
  kernelMode: session
ruby:
  interpreter: ""
astGrep:
  enabled: true
checkpoint:
  enabled: true
commands:
  enableClaudeUser: true
defaultThinkingLevel: auto
hideThinkingBlock: true
dev:
  autoqaConsent: granted
bash:
  autoBackground:
    enabled: true
  patterns:
    - match: rm -rf /
      approval: deny
    - match: rm -fr /
      approval: deny
    - match: rm -rf ~
      approval: deny
    - match: rm -fr ~
      approval: deny
    - match: rm -rf ~/
      approval: deny
    - match: rm -fr ~/
      approval: deny
    - match: rm -rf $HOME
      approval: deny
    - match: rm -fr $HOME
      approval: deny
    - match: rm -rf $HOME/
      approval: deny
    - match: rm -fr $HOME/
      approval: deny
    - match: "rm -rf ${HOME}"
      approval: deny
    - match: "rm -fr ${HOME}"
      approval: deny
    - match: "rm -rf ${HOME}/"
      approval: deny
    - match: "rm -fr ${HOME}/"
      approval: deny
    - match: git push --force
      approval: deny
    - match: git push --force *
      approval: deny
    - match: git push -f
      approval: deny
    - match: git push -f *
      approval: deny
    - match: git filter-branch*
      approval: deny
    # worktree.base is shared with herdr: `--all` would delete every live herdr worktree.
    - match: omp worktree clear*--all*
      approval: deny
    - match: omp wt clear*--all*
      approval: deny
features:
  unexpectedStopDetection: smart
compaction:
  idleEnabled: true
lsp:
  formatOnWrite: true
thinkingBudgets:
  max: 65536
textVerbosity: low
tier:
  subagent: inherit
skills:
  enabled: true
  enableSkillCommands: true
composer:
  shape: pi
codexResets:
  autoRedeem: "no"
worktree:
  base: "~/.herdr/worktrees"
