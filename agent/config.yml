task:
  agentModelOverrides:
    reviewer: openai-codex/gpt-5.6-terra:high
    # Bundled security-reviewer had no override, so it inherited the `task`
    # role (luna) -- the weakest coding model here (AA Coding Index 71.4) and
    # the worst long-context recall in the family (MRCR 41.3%). A security
    # audit is a long-context recall task over a diff plus its callers.
    security-reviewer: openai-codex/gpt-5.6-sol:high
  disabledAgents:
    - sonic
  eager: preferred
  showResolvedModelBadge: true
  enableLsp: true
  isolation:
    mode: none
modelRoles:
  default: anthropic/claude-opus-5:high
  # Fable 5 leads on raw intelligence (AA Intelligence Index 59.9 vs ~51 for
  # luna:max/glm-5.2) and SWE-bench Verified (95%); practitioners report it
  # plans better architecture up front, for fewer implementation iterations.
  # It LOSES to sol and terra on both coding indices, so it stays out of every
  # implementation role -- planning is the one slot its profile fits.
  # :high, not :max -- max burns subscription quota fastest for little gain on
  # planning, and quota is the binding constraint on a flat-rate plan.
  plan: anthropic/claude-fable-5:high
  slow: openai-codex/gpt-5.6-sol:high
  # luna:max == glm-5.2:max at 51 on AA Intelligence Index v4.1, and faster.
  # Rides the chatgpt plan instead of ollama-cloud's 8-slot concurrency cap.
  # Costs 272K of context vs glm-5.2's 1M -- see contextPromotionTarget in
  # models.yml, which sends an overflow back to glm-5.2 at score parity.
  task: openai-codex/gpt-5.6-luna:max
  smol: ollama-cloud/minimax-m3
  tiny: ollama-cloud/gpt-oss:20b
  designer: ollama-cloud/minimax-m3:high
  vision: ollama-cloud/minimax-m3
  commit: ollama-cloud/gpt-oss:120b
  advisor: ollama-cloud/minimax-m3:low
modelProviderOrder:
  - anthropic
  - openai-codex
  - ollama-cloud
  - opencode-go
  - cursor
  - google-antigravity
contextPromotion:
  enabled: true
theme:
  dark: dark-catppuccin
symbolPreset: nerd
statusLine:
  preset: compact
  separator: powerline-thin
  showHookStatus: true
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
display:
  showTokenUsage: true
  shimmer: kitt
  cacheMissMarker: true
doubleEscapeAction: tree
renderMermaid:
  enabled: true
github:
  enabled: true
memory:
  backend: mnemopi
setupVersion: 1
terminal:
  showProgress: false
tui:
  textSizing: false
advisor:
  enabled: true
steeringMode: one-at-a-time
interruptMode: immediate
stt:
  modelName: parakeet
  submitTrigger: never
  enabled: false
share:
  store: blob
magicKeywords:
  enabled: true
providers:
  memoryModel: online
  fireworksTier: standard
  tinyModel: online
  kimiApiFormat: auto
  ollama-cloud:
    maxConcurrency: 8
  webSearchOrder: []
retry:
  fallbackChains:
    # Terminal fallbacks land on openai-codex/gpt-5.6-luna: it rides the
    # already-paid chatgpt plan, so failover costs no new metered spend, and
    # every prior hop here is a third-party flat-rate provider that can fail
    # or queue together (ollama-cloud is capped at maxConcurrency 8, which a
    # wide subagent fan-out saturates).
    ollama-cloud/*:
      - opencode-go/*
      - openai-codex/gpt-5.6-luna:high
    ollama-cloud/gpt-oss:20b:
      - ollama-cloud/minimax-m3
    # commit role: fires once per commit on a tiny payload, so a plan-billed
    # terminal hop is negligible. gpt-oss:20b (tiny role) is deliberately left
    # failing over inside the free tier -- it is the highest-frequency role and
    # its output is disposable.
    ollama-cloud/gpt-oss:120b:
      - ollama-cloud/glm-5.2
      - opencode-go/glm-5.2
      - openai-codex/gpt-5.6-luna:high
    ollama-cloud/glm-5.2:
      - opencode-go/deepseek-v4-pro
      - opencode-go/glm-5.2
    # task role primary. glm-5.2:high is the score-parity peer, so a luna
    # outage degrades gracefully and lands back on the flat-rate tier.
    # Deliberately NOT terminated at luna in the glm-5.2 chain above: luna
    # points at glm-5.2 here, and the reverse edge would close a cycle.
    openai-codex/gpt-5.6-luna:
      - ollama-cloud/glm-5.2:high
      - opencode-go/glm-5.2
    openai-codex/gpt-5.6-sol:
      - openai-codex/gpt-5.6-terra
      - anthropic/claude-opus-5:high
    # plan role. Without this entry the `anthropic/*` wildcard would degrade to
    # terra, which is tuned for everyday coding, not planning. This key wins
    # over that wildcard by SPECIFICITY, not by document order -- resolution is
    # exact `provider/model-id`, then `provider/*`, then role, then `default`
    # (omp://settings.md:471), so moving it below the wildcard changes nothing.
    # Fable's subscription limits are
    # reportedly strict, and a limit hit blocks every anthropic model, so this
    # chain leaves the provider for sol -- the config's designated
    # deep-reasoning model (slow role, momus) -- before the generic terra hop.
    # Caveat: a 429/usage-limit only triggers this fallback while the stream
    # has not yet emitted observable output. A cap hit mid-plan, after text,
    # thinking, or tool calls have streamed, is classed non-retryable: the
    # turn fails and needs a manual Alt+R rather than silently landing on sol.
    # See omp://non-compaction-retry-policy.md:41 and :47.
    anthropic/claude-fable-5:
      - openai-codex/gpt-5.6-sol:high
      - openai-codex/gpt-5.6-terra:high
    anthropic/*:
      - openai-codex/gpt-5.6-terra:high
      - ollama-cloud/glm-5.2:high
    designer:
      - opencode-go/kimi-k3:high
      - ollama-cloud/glm-5.2:high
    opencode-go/kimi-k3:
      - ollama-cloud/glm-5.2:high
      - ollama-cloud/minimax-m3
    default:
      - openai-codex/gpt-5.6-sol:high
      - ollama-cloud/glm-5.2:high
mnemopi:
  dbPath: ""
  scoping: per-project
  proactiveLinking: true
  embeddingModel: ""
edit:
  mode: hashline
python:
  kernelMode: session
ruby:
  interpreter: ""
astGrep:
  enabled: true
checkpoint:
  enabled: true
commands:
  enableClaudeUser: true
defaultThinkingLevel: auto
hideThinkingBlock: true
dev:
  autoqaConsent: granted
bash:
  autoBackground:
    enabled: true
features:
  unexpectedStopDetection: true
compaction:
  idleEnabled: true
lsp:
  formatOnWrite: true
thinkingBudgets:
  max: 65536
tier:
  subagent: inherit
